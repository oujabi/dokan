<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../main.css">
    <title>Dokan, la voie de l'anneau</title>
</head>
<body>
    <header>
        <a href="/index">
            <img class="dokan-logo" src="../assets/logos/logo-dokan.png" alt="Logo Dokan" />
        </a>

        <nav>
            <ul>
                <li>
                    <a href="/dokan">Dokan</a>
                </li>
                <li>
                    <a href="/stages">Stages</a>
                </li>
                <li>
                    <a class="active" href="/medias">Médias</a>
                </li>
                <li>
                    <a href="/contact">Contacts</a>
                </li>
                <li>
                    <a href="/infos-pratiques">Infos pratiques</a>
                </li>
            </ul>
        </nav>

        <div class="burger-menu">
            <div class="burger-menu-line"></div>
            <div class="burger-menu-line"></div>
            <div class="burger-menu-line"></div>
        </div>

        <div class="burger-menu-close">
            <div class="burger-menu-line"></div>
            <div class="burger-menu-line"></div>
        </div>

        <div class="burger-menu-close-area"></div>
    </header>

    <main>
        <h1>Médias</h1>
        <hr class="large-hr">

        <div class="toggle-block toggle-illustrations">
            <h2>Illustrations</h2>
            <div class="open-toggle">
                <hr class="toggle-medias open-toggle-left"/>
                <hr class="toggle-medias open-toggle-right"/>
            </div>
            <div class="close-toggle">
                <hr class="toggle-medias close-toggle-left"/>
                <hr class="toggle-medias close-toggle-right"/>
            </div>
        </div>
        <div class="block-card block-medias block-illustrations">
            <div class="card card-single-img">
                <img src="../assets/illustrations/masque-samourai.webp" alt="illustration-1" loading="lazy">
            </div>
            <div class="card card-single-img">
                <img src="../assets/illustrations/samourai-castle.jpg" alt="illustration-2" loading="lazy">
            </div>
            <div class="card card-single-img">
                <img src="../assets/illustrations/aikido-tech.jpg" alt="illustration-3" loading="lazy">
            </div>
            <div class="card card-single-img">
                <img src="../assets/illustrations/katana.jpg" alt="illustration-4" loading="lazy">
            </div>
        </div>

        <div class="toggle-block toggle-pictures">
            <h2>Photos</h2>
            <div class="open-toggle">
                <hr class="toggle-medias open-toggle-left"/>
                <hr class="toggle-medias open-toggle-right"/>
            </div>
            <div class="close-toggle">
                <hr class="toggle-medias close-toggle-left"/>
                <hr class="toggle-medias close-toggle-right"/>
            </div>
        </div>

        <div class="block-card block-medias block-pictures">
            <div class="card card-single-img">
                <img class="img-media" src="../assets/pictures/dojo-aikido.png" alt="pictures-1" loading="lazy">
            </div>
            <div class="card card-single-img">
                <img class="img-media" src="../assets/pictures/Photo-Aikido-1.png" alt="pictures-2" loading="lazy">
            </div>
            <div class="card card-single-img">
                <img class="img-media" src="../assets/pictures/PratiqueBo.jpg" alt="pictures-3" loading="lazy">
            </div>
            <div class="card card-single-img">
                <img class="img-media" src="../assets/pictures/sports-aikido.jpg" alt="pictures-3" loading="lazy">
            </div>
        </div>

        <div class="toggle-block toggle-videos">
            <h2>Vidéos</h2>
            <div class="open-toggle">
                <hr class="toggle-medias open-toggle-left"/>
                <hr class="toggle-medias open-toggle-right"/>
            </div>
            <div class="close-toggle">
                <hr class="toggle-medias close-toggle-left"/>
                <hr class="toggle-medias close-toggle-right"/>
            </div>
        </div>
        <div class="block-card block-medias block-videos">
            <video controls width="100%" height="300" poster="../assets/poster-6767406.svg">
                <source src="../assets/videos/6767406-uhd_2560_1440_25fps.mp4" type="video/mp4">
                Votre navigateur ne prend pas en charge la vidéo.
            </video>
            <video controls width="100%" height="300" poster="../assets/poster-6767401.svg">
                <source src="../assets/videos/6767401-uhd_2560_1440_25fps.mp4" type="video/mp4">
                Votre navigateur ne prend pas en charge la vidéo.
            </video>
            <video controls width="100%" height="300" poster="../assets/poster-6266886.svg">
                <source src="../assets/videos/6266886-uhd_3840_2160_30fps.mp4" type="video/mp4">
                Votre navigateur ne prend pas en charge la vidéo.
            </video>
        </div>
    </main>

    <footer>
        <script type="module" src="../main.js"></script>
        <script type="module" src="../js/toggle-bar/eventToggleMedias.js"></script>
    </footer>
</body>
</html>
