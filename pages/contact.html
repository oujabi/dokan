        <a href="./../index.html">
            <img class="dokan-logo" src="./../assets/logo-Dokan.png" alt="Logo Dokan" />
        </a>

    <nav>

    <div class="burger-menu">
        <div class="burger-menu-line"></div>
        <div class="burger-menu-line"></div>

    <div class="burger-menu-close-area"></div>
</header>

    <main>
        <h1>Rejoignez-nous</h1>
        <hr class="large-hr">

        <form class="formulaire-inscription" novalidate>
            <!-- Bloc d'informations personnelles -->
            <fieldset>
                <div class="form-group">
                    <label for="prenom" aria-required="true">Prénom<span class="required">*</span> :</label>
                    <input type="text" id="prenom" name="prenom" placeholder="" required>
                    <span class="error error-prenom" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="nom" aria-required="true">Nom<span class="required">*</span> :</label>
                    <input type="text" id="nom" name="nom" placeholder="" required>
                    <span class="error error-nom" aria-live="polite"></span>
                </div>
            </fieldset>

            <!-- Bloc de contact -->
            <fieldset>
                <div class="form-group">
                    <label for="email" aria-required="true">Email<span class="required">*</span> :</label>
                    <input type="email" id="email" name="email" placeholder="" required>
                    <span class="error error-mail" aria-live="polite"></span>
                </div>
                <div class="form-group">
                    <label for="telephone">Téléphone :</label>
                    <input type="tel" id="telephone" name="telephone" placeholder="" pattern="[0-9]{10}">
                    <span class="error error-tel" aria-live="polite"></span>
                </div>
            </fieldset>

            <!-- Bloc object -->
            <fieldset>
                <div class="form-group">
                    <label for="object">Objet :</label>
                    <select id="object" name="object" >
                        <option value="information">Demande de renseignements</option>
                        <option value="inscription">Modalité d'inscription</option>
                        <option value="participation">Participer à un cours d'essai</option>
                        <option value="autre">Autre</option>
                    </select>
                    <span class="error error-object" aria-live="polite"></span>
                </div>
            </fieldset>

            <!-- Bloc des messages -->
            <fieldset>
                <div class="form-group">
                    <label for="message" aria-required="true">Message<span class="required">*</span> :</label>
                    <textarea id="message" name="message" placeholder="" minlength="1" maxlength="800" required></textarea>
                    <span class="error error-message" aria-live="polite"></span>
                </div>
            </fieldset>

            <!-- Bloc Validation -->
            <fieldset>
                <div class="form-group">
                    <input type="submit" value="Envoyer"/>
                </div>
            </fieldset>
        </form>
    </main>

    <footer>
        <script type="module" src="../main.js"></script>
        <script type="module" src="../js/inscription-form/eventInscriptionFormValidation.js"></script>
    </footer>
</body>
</html>
