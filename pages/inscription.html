<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./../main.css">
    <title>Dokan, la voie de l'anneau</title>
</head>
<body class="body-inscription">
<div>
    <header class="banner">
        <div class="dokan-logo">
                <span>
                    <a href="./../index.html">Dokan</a>
                </span>
        </div>

        <ul class="menu-top">
            <li class="not-active">
                <a href="./dokan-intro.html">
                    Dokan
                </a>
            </li>

            <li class="not-active">
                <a href="./stage-saison.html">
                    Stage de la saison
                </a>
            </li>

            <li class="not-active">
                <a href="./medias.html">
                    Médias
                </a>
            </li>

            <li class="active">
                <a href="./inscription.html">
                    Contacts
                </a>
            </li>

            <li class="not-active">
                <a href="./info-pratique.html">
                    Info pratique
                </a>
            </li>

        </ul>
    </header>

    <main>
        <h1>Rejoignez-nous</h1>
        <hr class="large-hr">

        <form class="formulaire-inscription" action="#">
            <div class="wrapper-form-inscription">
                <!-- Bloc : Informations personnelles -->
                <fieldset class="form-section">
                    <div class="form-group">
                        <label for="prenom" aria-required="true">Prénom *:</label>
                        <input type="text" id="prenom" name="prenom" required aria-describedby="nom-help" placeholder="">
                    </div>

                    <div class="form-group">
                        <label for="nom" aria-required="true">Nom *:</label>
                        <input type="text" id="nom" name="nom" required aria-describedby="nom-help" placeholder="">
                    </div>
                </fieldset>

                <!-- Bloc : Contact -->
                <fieldset class="form-section">
                    <div class="form-group">
                        <label for="email" aria-required="true">Email *:</label>
                        <input type="text" id="email" name="email" required placeholder="">
                    </div>


                    <div class="form-group">
                        <label for="telephone" aria-required="true">Téléphone :</label>
                        <input type="text" id="telephone" name="telephone" placeholder="">
                    </div>
                </fieldset>

                <!-- Bloc : messages -->
                <fieldset class="form-section">
                    <div class="form-group">
                        <label for="message" aria-required="true">Message :</label>
<!--                        <textarea id="message" name="message" rows="50" cols="20" placeholder="" required>-->
                            <textarea id="message" name="message" rows="50" cols="20" placeholder="" required>

                        </textarea>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <div class="form-group">
                        <input type="submit" value="Envoyer"/>
                    </div>
                </fieldset>

            </div>
        </form>
    </main>

    <footer>
        <script type="module" src="./../main.js"></script>
    </footer>
</div>
</body>
</html>
