<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../main.css">
    <title>Dokan, la voie de l'anneau</title>
</head>
<body class="body-regular-pages">
    <header>
        <a href="./../index.html">
            <img class="dokan-logo" src="./../assets/logo-Dokan.png" alt="Logo Dokan" />
        </a>

    <nav>
        <ul>
            <li>
                <a href="./../pages/dokan.html">Dokan</a>
            </li>
            <li>
                <a href="stages.html">Stages</a>
            </li>
            <li>
                <a href="./../pages/medias.html">Médias</a>
            </li>
            <li>
                <a class="active" href="./../pages/inscription.html">Contacts</a>
            </li>
            <li>
                <a href="./../pages/infos-pratiques.html">Infos pratiques</a>
            </li>
        </ul>
    </nav>

    <div class="burger-menu">
        <div class="burger-menu-line"></div>
        <div class="burger-menu-line"></div>
        <div class="burger-menu-line"></div>
    </div>

    <div class="burger-menu-close">
        <div class="burger-menu-line"></div>
        <div class="burger-menu-line"></div>
    </div>
</header>

    <main>
        <h1>Rejoignez-nous</h1>
        <hr class="large-hr">

        <form class="formulaire-inscription" action="#">
            <!-- Bloc d'informations personnelles -->
            <fieldset class="form-section">
                <div class="form-group">
                    <label for="prenom" aria-required="true">Prénom<span class="required">*</span> :</label>
                    <input type="text" id="prenom" name="prenom" required aria-describedby="nom-help" placeholder="">
                </div>

                <div class="form-group">
                    <label for="nom" aria-required="true">Nom<span class="required">*</span> :</label>
                    <input type="text" id="nom" name="nom" required aria-describedby="nom-help" placeholder="">
                </div>
            </fieldset>

            <!-- Bloc de contact -->
            <fieldset class="form-section">
                <div class="form-group">
                    <label for="email" aria-required="true">Email<span class="required">*</span> :</label>
                    <input type="text" id="email" name="email" required placeholder="">
                </div>


                <div class="form-group">
                    <label for="telephone">Téléphone :</label>
                    <input type="text" id="telephone" name="telephone" placeholder="">
                </div>
            </fieldset>

            <!-- Bloc des messages -->
            <fieldset class="form-section">
                <div class="form-group">
                    <label for="message" aria-required="true">Message<span class="required">*</span> :</label>
                        <textarea id="message" name="message" placeholder="" required>

                    </textarea>
                </div>
            </fieldset>

            <fieldset class="form-section">
                <div class="form-group">
                    <input type="submit" value="Envoyer"/>
                </div>
            </fieldset>
        </form>
    </main>

    <footer>
        <script type="module" src="../main.js"></script>
    </footer>
</body>
</html>
