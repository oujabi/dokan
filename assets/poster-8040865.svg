  <!-- Video file name -->
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">
    8040865-uhd_4096_2160_25fps.mp4
  </text>
  
  <!-- Decorative elements -->
  <line x1="100" y1="50" x2="100" y2="150" stroke="#c41e3a" stroke-width="2" opacity="0.5"/>
  <line x1="300" y1="100" x2="300" y2="200" stroke="#c41e3a" stroke-width="2" opacity="0.5"/>
  
  <!-- Aikido symbol -->
  <text x="200" y="50" text-anchor="middle" font-family="serif" font-size="24" fill="#c41e3a" opacity="0.8">気</text>
