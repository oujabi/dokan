<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="tatami" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0e6d2"/>
      <stop offset="100%" style="stop-color:#d4c4a8"/>
    </linearGradient>
  </defs>
  
  <!-- Tatami background -->
  <rect width="400" height="300" fill="url(#tatami)"/>
  
  <!-- Person 1 (Uke - attacker) -->
  <circle cx="150" cy="100" r="25" fill="#1a3d5e" opacity="0.8"/>
  <rect x="135" y="120" width="30" height="60" fill="#ffffff" rx="15"/>
  <rect x="125" y="180" width="50" height="20" fill="#1a3d5e" rx="10"/>
  <line x1="140" y1="140" x2="120" y2="160" stroke="#1a3d5e" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="140" x2="180" y2="160" stroke="#1a3d5e" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="120" x2="150" y2="140" stroke="#1a3d5e" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Person 2 (Nage - defender) -->
  <circle cx="250" cy="120" r="25" fill="#5e1a1a" opacity="0.8"/>
  <rect x="235" y="140" width="30" height="60" fill="#ffffff" rx="15"/>
  <rect x="225" y="200" width="50" height="20" fill="#5e1a1a" rx="10"/>
  <line x1="240" y1="160" x2="220" y2="180" stroke="#5e1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="260" y1="160" x2="280" y2="180" stroke="#5e1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="140" x2="250" y2="160" stroke="#5e1a1a" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Connection line (technique) -->
  <path d="M160 130 Q200 110 240 150" stroke="#c41e3a" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  
  <!-- Text -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1a3d5e" font-weight="bold">Kokyu-nage</text>
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5e1a1a">Technique de respiration</text>
</svg>
