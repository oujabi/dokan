<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="tatami2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f1eb"/>
      <stop offset="100%" style="stop-color:#dcd3c3"/>
    </linearGradient>
    <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#c41e3a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#c41e3a;stop-opacity:0.2"/>
    </radialGradient>
  </defs>
  
  <!-- Tatami background -->
  <rect width="400" height="300" fill="url(#tatami2)"/>
  
  <!-- Movement circle -->
  <circle cx="200" cy="150" r="80" fill="none" stroke="url(#circleGlow)" stroke-width="15" opacity="0.6"/>
  
  <!-- Person in movement -->
  <g transform="rotate(15 200 150)">
    <circle cx="200" cy="120" r="20" fill="#5e1a1a"/>
    <rect x="185" y="135" width="30" height="50" fill="#ffffff" rx="15"/>
    <rect x="175" y="185" width="50" height="15" fill="#5e1a1a" rx="7"/>
    <line x1="190" y1="150" x2="170" y2="170" stroke="#5e1a1a" stroke-width="4" stroke-linecap="round"/>
    <line x1="210" y1="150" x2="230" y2="170" stroke="#5e1a1a" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="135" x2="200" y2="150" stroke="#5e1a1a" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Trail effect -->
  <path d="M280 150 Q300 120 320 150 Q300 180 280 150" fill="none" stroke="#c41e3a" stroke-width="2" opacity="0.4" stroke-dasharray="5,3"/>
  <path d="M120 150 Q140 120 160 150 Q140 180 120 150" fill="none" stroke="#c41e3a" stroke-width="2" opacity="0.4" stroke-dasharray="5,3"/>
  
  <!-- Text -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1a3d5e" font-weight="bold">Irimi-nage</text>
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5e1a1a">Entrée et projection</text>
</svg>
