<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="symbolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#333333"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#symbolBg)"/>
  
  <!-- Red circle (symbol of harmony) -->
  <circle cx="200" cy="150" r="90" fill="none" stroke="#c41e3a" stroke-width="8"/>
  <circle cx="200" cy="150" r="70" fill="none" stroke="#c41e3a" stroke-width="6"/>
  <circle cx="200" cy="150" r="50" fill="none" stroke="#c41e3a" stroke-width="4"/>
  
  <!-- Kanji characters (Aikido: 合気道) -->
  <!-- 合 (Ai - harmony) -->
  <text x="150" y="120" font-family="serif" font-size="48" fill="#ffffff" text-anchor="middle">合</text>
  
  <!-- 気 (Ki - energy) -->
  <text x="250" y="120" font-family="serif" font-size="48" fill="#ffffff" text-anchor="middle">気</text>
  
  <!-- 道 (Do - way) -->
  <text x="200" y="180" font-family="serif" font-size="48" fill="#ffffff" text-anchor="middle">道</text>
  
  <!-- Decorative lines -->
  <line x1="100" y1="100" x2="120" y2="80" stroke="#c41e3a" stroke-width="2" opacity="0.7"/>
  <line x1="280" y1="80" x2="300" y2="100" stroke="#c41e3a" stroke-width="2" opacity="0.7"/>
  <line x1="100" y1="200" x2="120" y2="220" stroke="#c41e3a" stroke-width="2" opacity="0.7"/>
  <line x1="280" y1="220" x2="300" y2="200" stroke="#c41e3a" stroke-width="2" opacity="0.7"/>
  
  <!-- Text -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c41e3a" font-weight="bold">合気道</text>
  <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Aikido</text>
</svg>
