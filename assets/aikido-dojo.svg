<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="dojoFloor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3"/>
      <stop offset="100%" style="stop-color:#d4b89a"/>
    </linearGradient>
    <linearGradient id="dojoWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513"/>
      <stop offset="100%" style="stop-color:#654321"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Dojo background -->
  <rect width="400" height="300" fill="url(#dojoFloor)"/>
  
  <!-- Walls -->
  <rect x="0" y="0" width="400" height="40" fill="url(#dojoWall)"/>
  
  <!-- Tatami lines -->
  <line x1="0" y1="40" x2="400" y2="40" stroke="#8b4513" stroke-width="2"/>
  <line x1="0" y1="130" x2="400" y2="130" stroke="#8b4513" stroke-width="2"/>
  <line x1="0" y1="220" x2="400" y2="220" stroke="#8b4513" stroke-width="2"/>
  
  <!-- Kamiza (front of dojo) -->
  <rect x="150" y="20" width="100" height="25" fill="#c41e3a" opacity="0.8"/>
  <text x="200" y="38" text-anchor="middle" font-family="serif" font-size="14" fill="#ffffff">神</text>
  
  <!-- Person in seiza (kneeling position) -->
  <g filter="url(#shadow)">
    <ellipse cx="200" cy="200" rx="25" ry="15" fill="#1a3d5e"/>
    <rect x="185" y="185" width="30" height="20" fill="#ffffff" rx="10"/>
    <circle cx="200" cy="175" r="15" fill="#1a3d5e"/>
  </g>
  
  <!-- Hakama (traditional pants) -->
  <path d="M170 200 Q200 215 230 200 L230 185 Q200 170 170 185 Z" fill="#1a3d5e"/>
  
  <!-- Text -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1a3d5e" font-weight="bold">Dojo</text>
  <text x="200" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5e1a1a">Lieu de pratique</text>
</svg>
